spring:
  application:
    name: primary-homework-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:primary_homework_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.primaryhomework.backend: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:primary-homework-local-secret-key-please-change}
    expire-seconds: ${APP_JWT_EXPIRE_SECONDS:7200}
  oss:
    enabled: ${APP_OSS_ENABLED:false}
    endpoint: ${APP_OSS_ENDPOINT:}
    region: ${APP_OSS_REGION:}
    bucket-name: ${APP_OSS_BUCKET_NAME:}
    access-key-id: ${APP_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${APP_OSS_ACCESS_KEY_SECRET:}
    public-base-url: ${APP_OSS_PUBLIC_BASE_URL:}
    prefix: ${APP_OSS_PREFIX:primary-homework}
  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR:uploads}
    public-base-url: ${APP_FILE_PUBLIC_BASE_URL:}
